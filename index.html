<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deal Finder</title>
<style>
:root{--bg:#fff;--fg:#111;--card:#f1f3f5;--ac:#0b6bcb}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--fg:#eee;--card:#1e1e1e;--ac:#5aa9ff}}
body{margin:0;padding:12px;font-family:sans-serif;background:var(--bg);color:var(--fg)}
h1{font-size:20px}input,select,button{width:100%;box-sizing:border-box;padding:10px;margin:4px 0;font-size:16px;border-radius:8px;border:1px solid #888;background:var(--card);color:var(--fg)}
button{background:var(--ac);color:#fff;border:0}.card{background:var(--card);padding:10px;border-radius:8px;margin:8px 0}
small{opacity:.75}
</style></head><body>
<h1>Deal Finder</h1>
<div class="card"><b>Add item</b>
<input id="n" placeholder="Item name">
<input id="cost" type="number" step="0.01" placeholder="Purchase cost">
<input id="post" type="number" step="0.01" placeholder="Postage cost">
<input id="est" type="number" step="0.01" placeholder="Estimated sale price">
<input id="fee" type="number" step="0.01" placeholder="Selling fee % (check your eBay fees)">
<select id="st"><option>Planned</option><option>Bought</option><option>Awaiting listing</option><option>Listed</option><option>Sold</option><option>Unsold</option><option>Returned</option></select>
<button onclick="add()">Save item</button></div>
<div id="list"></div>
<div class="card"><b>Backup</b><br><small>A backup saves your items to a file. Importing REPLACES everything currently in the app.</small>
<button onclick="exp()">Export Backup</button>
<input type="file" id="f" accept=".json" onchange="imp(this)"></div>
<script>
const K='dealfinder_items';
function load(){try{return JSON.parse(localStorage.getItem(K))||[]}catch(e){return[]}}
function save(a){localStorage.setItem(K,JSON.stringify(a))}
function add(){const v=id=>parseFloat(document.getElementById(id).value)||0;
const n=document.getElementById('n').value.trim();if(!n)return alert('Enter an item name');
const a=load();a.push({id:Date.now(),name:n,cost:v('cost'),post:v('post'),est:v('est'),fee:v('fee'),status:document.getElementById('st').value,date:new Date().toISOString().slice(0,10)});
save(a);['n','cost','post','est','fee'].forEach(i=>document.getElementById(i).value='');render()}
function del(i){if(confirm('Delete this item?')){save(load().filter(x=>x.id!==i));render()}}
function render(){document.getElementById('list').innerHTML=load().map(x=>{
const out=x.cost+x.post+x.est*x.fee/100,p=x.est-out,r=x.cost>0?p/(x.cost+x.post)*100:0;
return `<div class="card"><b>${x.name.replace(/</g,'&lt;')}</b> <small>${x.status} · ${x.date}</small><br>
Estimated profit: ${p.toFixed(2)} (ROI ${r.toFixed(0)}%)<br><small>Estimate only, not an actual result</small><br>
<button onclick="del(${x.id})">Delete</button></div>`}).join('')}
function exp(){const b=new Blob([JSON.stringify(load())],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='deal-finder-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function imp(el){const f=el.files[0];if(!f)return;if(!confirm('This will REPLACE all items in the app with the backup. Continue?')){el.value='';return}
const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;save(d);render();alert('Backup restored')}catch(e){alert('That file is not a valid backup')}};r.readAsText(f)}
render();
</script></body></html>
