
name: Build APK v2
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm install @capacitor/share@7 @capacitor/filesystem@7
      - run: mkdir -p www && f=$(ls app-v*.html 2>/dev/null | sort -V | tail -1); cp "${f:-index.html}" www/index.html
      - run: npx cap add android
      - run: npx cap sync android
      - run: sed -i "s/versionCode [0-9]*/versionCode $((100 + ${{ github.run_number }}))/" android/app/build.gradle && grep versionCode android/app/build.gradle
      - run: mkdir -p ~/.android && base64 -d deal-finder-key.txt > ~/.android/debug.keystore
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create apk2-${{ github.run_number }} android/app/build/outputs/apk/debug/app-debug.apk --title "APK v2 build ${{ github.run_number }}" --notes "Test build"
